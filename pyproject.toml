[project]
name = "paper-trading-bot"
version = "0.1.0"
description = "Paper-trading bot: self-learning calibrated probabilities on BTC/ETH. Based on ai-hedge-fund (MIT, Virat Singh) + ccxt."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4",
    "pandas>=2.1",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "ccxt>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hedge_fund"]
