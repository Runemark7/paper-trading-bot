# Windows discovery farm (Alexander / jensa). Not the k8s live stack.
# GPU is unused. Mount a local PAPER_STATE that already has crypto_history_5m.json.
#
#   docker compose -f docker-compose.discovery.yml up --build
#
# Create a `.env` next to this file (never commit the token):
#   PAPER_DISCOVERY_INGEST_TOKEN=...
#   PAPER_STATE_DIR=./state
#   DISCOVERY_WORKERS=2
services:
  discovery:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: paperbot-discovery
    environment:
      PAPER_STATE: /app/state
      PAPER_ONLY: "1"
      PAPER_DISCOVERY_INGEST_URL: ${PAPER_DISCOVERY_INGEST_URL:-https://trading.runevibe.se/api/discovery/ingest}
      PAPER_DISCOVERY_INGEST_TOKEN: ${PAPER_DISCOVERY_INGEST_TOKEN}
      PAPER_DISCOVERY_BASE_URL: ${PAPER_DISCOVERY_BASE_URL:-https://trading.runevibe.se}
      DISCOVERY_WORKERS: ${DISCOVERY_WORKERS:-2}
      DISCOVERY_STRUCTURE_LOOKBACK_MAX: ${DISCOVERY_STRUCTURE_LOOKBACK_MAX:-96}
      DISCOVERY_EVAL_TIMEOUT_SECONDS: ${DISCOVERY_EVAL_TIMEOUT_SECONDS:-600}
    volumes:
      - ${PAPER_STATE_DIR:-./state}:/app/state
    entrypoint: ["python", "/app/scripts/discovery_worker.py"]
    command: ["--workers", "${DISCOVERY_WORKERS:-2}"]
    restart: unless-stopped
