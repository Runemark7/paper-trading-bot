apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperbot-backend
  namespace: trading
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite single-writer safety
  selector:
    matchLabels:
      app: paperbot-backend
  template:
    metadata:
      labels:
        app: paperbot-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
            - name: DISCOVERY_ON_CYCLE
              value: "0"
            - name: PAPER_DISCOVERY_MODE
              value: "off"
            # Shared secret for POST /api/discovery/ingest (Windows worker).
            # Create: kubectl -n trading create secret generic paper-discovery-ingest --from-literal=token='...'
            - name: PAPER_DISCOVERY_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paper-discovery-ingest
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              # 512Mi is enough: GET /api/champions is read-only (no collect_live_results)
              # and GET /api/live / /api/candles reuse one CcxtSource per venue instead of
              # constructing ccxt.binance() per request (that was the OOM, not the rows).
              memory: 512Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state

        # Continuous price / stop-loss / take-profit watcher
        - name: heartbeat
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "hedge_fund.trading.heartbeat", "--interval", "30"]
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state

        # 5-minute decision cycle (24/7): run_isolated → collect_live_results
        # → hourly_report. Discovery walk-forwards are OFF
        # (DISCOVERY_ON_CYCLE=0) — they run on the Windows PC, not this
        # 1 CPU / 1.5GiB sidecar. Sleep 300s so 5m bars can trade on close.
        # Same pod as heartbeat/web so they share the RWO PVC; SQLite WAL +
        # file lock serializes writers. Replaces Hermes cron paperbot-live-cycle.
        - name: cycle
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                python /app/scripts/live_cycle.py || true
                sleep 300
              done
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
            - name: TZ
              value: Europe/Stockholm
            - name: DISCOVERY_ON_CYCLE
              value: "0"
            - name: PAPER_DISCOVERY_MODE
              value: "off"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state


      volumes:
        - name: state-storage
          persistentVolumeClaim:
            claimName: paperbot-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paperbot-backend-svc
  namespace: trading
spec:
  selector:
    app: paperbot-backend
  ports:
    - name: http
      port: 8787
      targetPort: 8787
