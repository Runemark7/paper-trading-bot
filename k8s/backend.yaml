apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperbot-backend
  namespace: trading
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite single-writer safety
  selector:
    matchLabels:
      app: paperbot-backend
  template:
    metadata:
      labels:
        app: paperbot-backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state

        # Continuous price / stop-loss / take-profit watcher
        - name: heartbeat
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "hedge_fund.trading.heartbeat", "--interval", "30"]
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state

        # Hourly Hermes live-cycle (07–21 Europe/Stockholm): tournament discovery
        # → run_isolated → collect_live_results → hourly_report. Same pod as
        # heartbeat/web so they share the RWO PVC; SQLite WAL + file lock
        # serializes writers. Replaces Hermes cron paperbot-live-cycle.
        - name: cycle
          image: ghcr.io/runemark7/paper-trading-bot/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                H=$(TZ=Europe/Stockholm date +%H)
                if [ "$H" -ge 7 ] && [ "$H" -le 21 ]; then
                  python /app/scripts/live_cycle.py || true
                else
                  echo "live_cycle: outside 07-21 Stockholm (H=$H), skip"
                fi
                sleep 3600
              done
          env:
            - name: PAPER_STATE
              value: /app/state
            - name: PAPER_STRATEGY
              value: sma_stack
            - name: PAPER_ONLY
              value: "1"
            - name: TZ
              value: Europe/Stockholm
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: state-storage
              mountPath: /app/state


      volumes:
        - name: state-storage
          persistentVolumeClaim:
            claimName: paperbot-state-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paperbot-backend-svc
  namespace: trading
spec:
  selector:
    app: paperbot-backend
  ports:
    - name: http
      port: 8787
      targetPort: 8787
