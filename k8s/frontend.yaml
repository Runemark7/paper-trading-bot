apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperbot-frontend
  namespace: trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperbot-frontend
  template:
    metadata:
      labels:
        app: paperbot-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        # nginx:1.27-alpine USER nginx is uid 101 (not 1000 — that's the backend image).
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/runemark7/paper-trading-bot/frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://paperbot-backend-svc.trading.svc.cluster.local:8787"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paperbot-frontend-svc
  namespace: trading
spec:
  selector:
    app: paperbot-frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
