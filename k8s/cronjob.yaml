apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperbot-cycle-4h
  namespace: trading
spec:
  # Run every 4 hours (matches the 4h timeframe strategies)
  schedule: "0 */4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: paperbot-cycle
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: cycle
              image: ghcr.io/runemark7/paperbot-backend:latest
              imagePullPolicy: Always
              command: ["python", "-m", "hedge_fund.trading.run", "--cycles", "1"]
              env:
                - name: PAPER_STATE
                  value: /app/state
                - name: PAPER_STRATEGY
                  value: sma_stack
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: state-storage
                  mountPath: /app/state
          volumes:
            - name: state-storage
              persistentVolumeClaim:
                claimName: paperbot-state-pvc
