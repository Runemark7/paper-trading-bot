name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/runemark7/paper-trading-bot/backend
  FRONTEND_IMAGE: ghcr.io/runemark7/paper-trading-bot/frontend

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + pytest
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Runemark7/paper-trading-bot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: false
          sbom: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Runemark7/paper-trading-bot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Pin kustomize image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq -i "(.images[] | select(.name == \"ghcr.io/runemark7/paper-trading-bot/backend\")).newTag = \"${GITHUB_SHA}\"" k8s/kustomization.yaml
          yq -i "(.images[] | select(.name == \"ghcr.io/runemark7/paper-trading-bot/frontend\")).newTag = \"${GITHUB_SHA}\"" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No tag change"
            exit 0
          fi
          git commit -m "ci: pin paperbot image tags to ${GITHUB_SHA} [skip ci]"
          git push
      - name: Save images for cluster import fallback
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker pull "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker pull "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker save \
            "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" \
            "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            | gzip > /tmp/paperbot-images.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: paperbot-images
          path: /tmp/paperbot-images.tar.gz
          retention-days: 2
